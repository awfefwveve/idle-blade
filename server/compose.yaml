# Local development only. Do not deploy these credentials publicly.
services:
  postgres:
    restart: unless-stopped
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdev
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 3s
      timeout: 3s
      retries: 20
  nakama:
    restart: unless-stopped
    image: registry.heroiclabs.com/heroiclabs/nakama:3.41.0
    entrypoint:
      - /bin/sh
      - -ec
      - >
        /nakama/nakama migrate up --database.address postgres:localdev@postgres:5432/nakama &&
        exec /nakama/nakama --name idleblade --database.address postgres:localdev@postgres:5432/nakama
        --runtime.js_entrypoint index.js --socket.server_key localdevkey
        --runtime.env IDLEBLADE_DEV_RESET=true
    volumes:
      - ./modules:/nakama/data/modules:ro
    ports:
      - "127.0.0.1:7350:7350"
      - "127.0.0.1:7351:7351"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  database:
